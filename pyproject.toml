[build-system]
requires = ["setuptools>=61", "versioningit"]
build-backend = "setuptools.build_meta"

[project]
name = "pyinsts"
version = "0.1.0"
description = "PyVISA仪器控制库，支持Keysight和Rohde&Schwarz仪器"
authors = [
    { name = "zhangxp93", email = "937097345@qq.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ftd2xx>=1.3.8",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyserial>=3.5",
    "pyvisa>=1.14.1",
    "pyyaml>=6.0.3",
    "versioningit>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyvisa-sim>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/zhangxp93/PyInst"
Repository = "https://github.com/zhangxp93/PyInst"
Changelog = "https://github.com/zhangxp93/PyInst/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyinsts = ["instrument/sim/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.versioningit]
default-version = "0.1.0"

[tool.versioningit.write]
file = "src/pyinsts/_version.py"
